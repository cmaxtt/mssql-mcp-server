# Integration test compose — SQL Server only (MCP server runs in-process)
# Usage: docker compose -f docker-compose.test.yml up -d
# Pass SA password via MSSQL_SA_PASSWORD env var (never hardcode)

services:
  mssql-test:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    container_name: mssql_mcp_test
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}
    ports:
      - "14333:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      retries: 20
      start_period: 10s
